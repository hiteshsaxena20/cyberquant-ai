version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: cyberquant-db
    environment:
      POSTGRES_USER: cyberquant
      POSTGRES_PASSWORD: cyberquant_secure_2026
      POSTGRES_DB: cyberquant_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberquant"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberquant-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://cyberquant:cyberquant_secure_2026@db:5432/cyberquant_db
      SECRET_KEY: cyberquant-secret-key-change-in-production
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cyberquant-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
